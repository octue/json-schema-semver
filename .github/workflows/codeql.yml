name: "CodeQL"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Pinned for the same reason as the tests: a known compiler for the
    # vendored dependencies
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # C++ has to be compiled for CodeQL to analyse it
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The library and the command-line tool. The tests are left out, as
      # they would mostly add findings about GoogleTest
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          cmake -S . -B ./build \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DJSS_CLI:BOOL=ON \
            -DJSS_TESTS:BOOL=OFF \
            -DJSS_PYTHON:BOOL=OFF \
            -DBUILD_SHARED_LIBS:BOOL=OFF
          cmake --build ./build --config Release --parallel 4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
