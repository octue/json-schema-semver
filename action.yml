name: 'Suggest JSON Schema semantic version'
description: 'Compare two JSON Schemas and suggest the semantic version of the new one.'
author: 'Octue'
branding:
  icon: tag
  color: red

inputs:
  path:
    description: 'The path to the proposed JSON schema (relative to the repository root).'
    required: true
  base_path:
    description: 'The path to the JSON schema to compare against (relative to the repository root). If not provided, there is nothing to compare against and the suggestion is the initial version.'
    required: false
    default: ''
  base_version:
    description: 'The semantic version of the base schema. If not provided, only the type of change is reported.'
    required: false
    default: ''
  stage:
    description: 'The stage of the project, which sets the part of the version that a breaking change bumps: `stable` (X+1.0.0), `development` (0.Y+1.0, for versions below 1.0.0) or `prototype` (0.0.Z+1, for versions below 0.1.0).'
    required: false
    default: 'stable'
  initial_version:
    description: 'The semantic version to suggest when there is no base schema.'
    required: false
    default: '0.0.1'
  cli_version:
    description: 'The release of the `json-schema-semver` command-line tool to download (e.g. `v1.2.3`). Defaults to the version of this action.'
    required: false
    default: ''
  cli_path:
    description: 'The path to an existing `json-schema-semver` binary to use instead of downloading one.'
    required: false
    default: ''

outputs:
  version:
    description: 'The suggested semantic version, or empty if no base version was provided'
    value: ${{ steps.suggest.outputs.version }}
  change:
    description: 'The type of change detected (equal, initial, patch, minor, or major)'
    value: ${{ steps.suggest.outputs.change }}
  traces:
    description: 'The incompatibilities between the schemas that explain the change, as a JSON array'
    value: ${{ steps.suggest.outputs.traces }}

runs:
  using: 'composite'
  steps:
    - id: suggest
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action/suggest.sh"
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE_PATH: ${{ inputs.base_path }}
        INPUT_BASE_VERSION: ${{ inputs.base_version }}
        INPUT_STAGE: ${{ inputs.stage }}
        INPUT_INITIAL_VERSION: ${{ inputs.initial_version }}
        INPUT_CLI_VERSION: ${{ inputs.cli_version }}
        INPUT_CLI_PATH: ${{ inputs.cli_path }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
