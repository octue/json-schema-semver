[project]
name = "json-schema-semver"
version = "0.2.0"
description = ""
authors = [
    {name = "Juan Cruz Viotti", email = "jv@jviotti.com"},
    {name = "Tom Clark", email = "tom@octue.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.args = [
  "-DCMAKE_BUILD_TYPE:STRING=Release",
  "-DJSS_PYTHON=ON",
  "-DJSS_TESTS=OFF",
  "-DBUILD_SHARED_LIBS:BOOL=OFF"
]
