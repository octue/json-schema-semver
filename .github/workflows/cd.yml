name: CD

# Every release artefact is built and tested on pull requests into `main`, so
# that problems show up before a release is attempted. Nothing is published
# unless the workflow runs for a tag
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs that publish ask for more
permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      EMSDK_VERSION: 4.0.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk/emsdk activate ${{ env.EMSDK_VERSION }}
          # Append (do not prepend) emsdk to PATH so the system `cmake`
          # binary is still found first. `emsdk/upstream/emscripten`
          # contains a sub-directory called `cmake/` (the toolchain
          # module) which would otherwise shadow the real `cmake`
          # executable, causing GNU Make's `execvp` to fail with
          # "Permission denied".
          echo "PATH=$PATH:$(pwd)/emsdk/upstream/emscripten" >> $GITHUB_ENV
      - run: make -C bindings/webassembly compile
      - run: make -C bindings/webassembly test
      - name: Set package version
        working-directory: bindings/webassembly
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]
          then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # The tarball is attached to the GitHub release, so that the package
      # can be installed from its URL without a token
      - run: npm pack
        working-directory: bindings/webassembly
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: bindings/webassembly/*.tgz
          if-no-files-found: error

      - run: npm publish
        working-directory: bindings/webassembly
        if: github.ref_type == 'tag'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    strategy:
      matrix:
        platform:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          - os: macos-15
            name: macos-arm64

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]
          then
            echo "JSS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "JSS_VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      # A fully static binary that runs on any Linux distribution
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          docker build . --file cli/Dockerfile --progress plain
          --build-arg "JSS_VERSION=$JSS_VERSION" --output dist/cli

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B ./build \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DJSS_CLI:BOOL=ON \
            -DJSS_TESTS:BOOL=OFF \
            -DJSS_PYTHON:BOOL=OFF \
            -DJSS_VERSION:STRING="$JSS_VERSION" \
            -DBUILD_SHARED_LIBS:BOOL=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET:STRING=14.0
          cmake --build ./build --config Release --target octue_jss_cli --parallel 4
          mkdir -p dist/cli
          cp ./build/cli/json-schema-semver dist/cli

      - run: sh test/cli/run.sh dist/cli/json-schema-semver
      - run: test "$(dist/cli/json-schema-semver --version)" = "$JSS_VERSION"

      # The name has no version, so that the latest release can be downloaded
      # from a fixed URL
      - name: Package
        run: |
          cp LICENSE NOTICE dist/cli
          tar -czf "json-schema-semver-${{ matrix.platform.name }}.tar.gz" \
            -C dist/cli json-schema-semver LICENSE NOTICE

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform.name }}
          path: json-schema-semver-${{ matrix.platform.name }}.tar.gz
          if-no-files-found: error

  # The wheels that get published to PyPI, built as configured in the
  # `[tool.cibuildwheel]` section of `pyproject.toml`
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-15 ]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set package version
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak -E "s/^version = \".*\"$/version = \"$VERSION\"/" pyproject.toml
          rm pyproject.toml.bak
          grep "^version = \"$VERSION\"$" pyproject.toml

      # To keep pull requests quick, they only build for the oldest and the
      # newest Python versions that we support
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp39-* cp313-*' || 'cp39-* cp310-* cp311-* cp312-* cp313-*' }}

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/checkout@v4
      - name: Set package version
        if: github.ref_type == 'tag'
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          uv version --no-sync "$VERSION"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - run: docker build --tag json-schema-semver-arm64 . --file bindings/python/Dockerfile --progress plain --platform linux/arm64
      - run: docker build --tag json-schema-semver-amd64 . --file bindings/python/Dockerfile --progress plain --platform linux/amd64
      - run: sleep 5
      - run: docker create --name json-schema-semver-builder-arm64 json-schema-semver-arm64
      - run: docker create --name json-schema-semver-builder-amd64 json-schema-semver-amd64
      - run: sleep 5
      - run: mkdir -p bindings/python/dist/docker
      - run: docker cp json-schema-semver-builder-arm64:/source/bindings/python/dist bindings/python/dist/docker
      - run: docker cp json-schema-semver-builder-amd64:/source/bindings/python/dist bindings/python/dist/docker
      - run: sleep 5
      - run: mv bindings/python/dist/docker/dist/*.whl bindings/python/dist
      - run: rm -rf bindings/python/dist/docker
      - run: sha256sum bindings/python/dist/*.whl
      # `unzip` only takes one archive at a time
      - run: for wheel in bindings/python/dist/*.whl; do unzip -t "$wheel"; done

      - uses: actions/upload-artifact@v4
        with:
          name: python-bindings-docker
          path: bindings/python/dist/*

  # Check that the GitHub Action works with the command-line tool we just
  # built, on every platform it supports, by serving the tool in the same
  # layout as a release
  action-prerelease:
    needs: [ cli ]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/release
      - run: |
          cd "$RUNNER_TEMP/release"
          shasum -a 256 -- *.tar.gz > SHA256SUMS
          echo "JSON_SCHEMA_SEMVER_RELEASE_URL=file://$RUNNER_TEMP/release" >> "$GITHUB_ENV"
      - id: version
        uses: ./
        with:
          path: test/cli/schemas/minor.json
          base_path: test/cli/schemas/base.json
          base_version: 1.2.3
      - run: |
          test "${{ steps.version.outputs.version }}" = "1.3.0"
          test "${{ steps.version.outputs.change }}" = "minor"

  github:
    needs: [ npm, wheels, python-docker, cli, action-prerelease ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      # The Python wheels, the command-line tool and the npm package
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .
      - run: tree release && cat release/SHA256SUMS
      - run: gh config set prompt disabled
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          gh release create ${{ github.ref_name }} --draft=false --title ${{ github.ref_name }} --target "$GITHUB_SHA" --generate-notes
          gh release upload --clobber ${{ github.ref_name }} release/*
        env:
          GH_TOKEN: ${{ github.token }}

  # Check that the GitHub Action can download the tool from the new release,
  # without a token, on every platform it supports
  action-release:
    needs: [ github ]
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-15 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        uses: ./
        with:
          path: test/cli/schemas/minor.json
          base_path: test/cli/schemas/base.json
          base_version: 1.2.3
          cli_version: ${{ github.ref_name }}
      - run: |
          test "${{ steps.version.outputs.version }}" = "1.3.0"
          test "${{ steps.version.outputs.change }}" = "minor"

  # Publish the wheels to PyPI with trusted publishing, which needs no token.
  # The project on PyPI must have this repository, this workflow file
  # (`cd.yml`) and the `pypi` environment set up as a trusted publisher.
  # This comes last because a version cannot be published to PyPI twice
  pypi:
    needs: [ wheels, github, action-release ]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/json-schema-semver/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
