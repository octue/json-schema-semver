name: CI

on:
  push:

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: ubuntu-latest
            cc: gcc
            cxx: g++

    runs-on: ${{ matrix.platform.os }}
    env:
      CC: ${{ matrix.platform.cc }}
      CXX: ${{ matrix.platform.cxx }}
    steps:
      - name: Install ClangFormat
        run: pipx install clang-format==19.1.0
      - run: cmake --version
      - uses: actions/checkout@v4
      - run: >
          cmake -S . -B ./build
          -DCMAKE_BUILD_TYPE:STRING=Release
          -DJSS_TESTS:BOOL=ON
          -DJSS_PYTHON:BOOL=OFF
          -DJSS_CLI:BOOL=ON
          -DBUILD_SHARED_LIBS:BOOL=OFF
          -DCMAKE_COMPILE_WARNING_AS_ERROR:BOOL=ON
      - run: cmake --build ./build --config Release --target clang_format_test
      - run: cmake --build ./build --config Release --parallel 4
      - run: cd ./build && ctest --build-config Release --output-on-failure --parallel

  bindings:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    strategy:
      fail-fast: false
      matrix:
        binding:
          - name: webassembly
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: python
            os: ubuntu-latest
            cc: clang
            cxx: clang++
    env:
      EMSDK_VERSION: 4.0.5
      CC: ${{ matrix.binding.cc }}
      CXX: ${{ matrix.binding.cxx }}

    runs-on: ${{ matrix.binding.os }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk/emsdk activate ${{ env.EMSDK_VERSION }}
          # Append (do not prepend) emsdk to PATH so the system `cmake`
          # binary is still found first. `emsdk/upstream/emscripten`
          # contains a sub-directory called `cmake/` (the toolchain
          # module) which would otherwise shadow the real `cmake`
          # executable, causing GNU Make's `execvp` to fail with
          # "Permission denied".
          echo "PATH=$PATH:$(pwd)/emsdk/upstream/emscripten" >> $GITHUB_ENV
        if: matrix.binding.name == 'webassembly'
      - uses: snok/install-poetry@v1.3.4
        if: matrix.binding.name == 'python'
      - run: make -C bindings/${{ matrix.binding.name }} compile
      - run: make -C bindings/${{ matrix.binding.name }} test

  python-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag json-schema-semver . --file bindings/python/Dockerfile --progress plain

  # Test the GitHub Action defined in `action.yml`
  action:
    if: "!contains(github.event.head_commit.message, 'skipci')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >
          cmake -S . -B ./build
          -DCMAKE_BUILD_TYPE:STRING=Release
          -DJSS_CLI:BOOL=ON
          -DJSS_TESTS:BOOL=OFF
          -DJSS_PYTHON:BOOL=OFF
          -DBUILD_SHARED_LIBS:BOOL=OFF
      - run: cmake --build ./build --config Release --target octue_jss_cli --parallel 4

      - name: Minor change at the minor breaking level
        id: minor
        uses: ./
        with:
          path: test/cli/schemas/minor.json
          base_path: test/cli/schemas/base.json
          base_version: 0.3.1
          breaking: minor
          cli_path: build/cli/json-schema-semver
      - run: |
          test "${{ steps.minor.outputs.version }}" = "0.4.0"
          test "${{ steps.minor.outputs.change }}" = "minor"
          test "$(echo "$TRACES" | jq --raw-output '.[0].right')" = "/enum"
        env:
          TRACES: ${{ steps.minor.outputs.traces }}

      - name: Breaking change at the default breaking level
        id: major
        uses: ./
        with:
          path: test/cli/schemas/major.json
          base_path: test/cli/schemas/base.json
          base_version: 0.3.1
          cli_path: build/cli/json-schema-semver
      - run: |
          test "${{ steps.major.outputs.version }}" = "1.0.0"
          test "${{ steps.major.outputs.change }}" = "major"

      - name: Breaking change at the patch breaking level
        id: patch
        uses: ./
        with:
          path: test/cli/schemas/major.json
          base_path: test/cli/schemas/base.json
          base_version: 0.0.3
          breaking: patch
          cli_path: build/cli/json-schema-semver
      - run: |
          test "${{ steps.patch.outputs.version }}" = "0.0.4"
          test "${{ steps.patch.outputs.change }}" = "major"

      - name: No base schema
        id: initial
        uses: ./
        with:
          path: test/cli/schemas/base.json
          cli_path: build/cli/json-schema-semver
      - run: |
          test "${{ steps.initial.outputs.version }}" = "0.0.1"
          test "${{ steps.initial.outputs.change }}" = "initial"
          test '${{ steps.initial.outputs.traces }}' = "[]"

      - name: No base schema with a custom initial version
        id: initial_custom
        uses: ./
        with:
          path: test/cli/schemas/base.json
          initial_version: 0.1.0
          cli_path: build/cli/json-schema-semver
      - run: test "${{ steps.initial_custom.outputs.version }}" = "0.1.0"

      - name: No base version
        id: no_base_version
        uses: ./
        with:
          path: test/cli/schemas/minor.json
          base_path: test/cli/schemas/base.json
          cli_path: build/cli/json-schema-semver
      - run: |
          test "${{ steps.no_base_version.outputs.version }}" = ""
          test "${{ steps.no_base_version.outputs.change }}" = "minor"

      - name: Base version too high for the breaking level
        id: breaking_error
        continue-on-error: true
        uses: ./
        with:
          path: test/cli/schemas/major.json
          base_path: test/cli/schemas/base.json
          base_version: 0.3.1
          breaking: patch
          cli_path: build/cli/json-schema-semver
      - run: test "${{ steps.breaking_error.outcome }}" = "failure"

      - name: Schemas that cannot be compared
        id: unknown
        continue-on-error: true
        uses: ./
        with:
          path: test/cli/schemas/base.json
          base_path: test/cli/schemas/unknown.json
          base_version: 1.0.0
          cli_path: build/cli/json-schema-semver
      - run: test "${{ steps.unknown.outcome }}" = "failure"

      # Without `cli_path`, the action downloads the tool from a release. To
      # test that before there is a release, serve the binary we just built
      # in the same layout as a release
      - name: Prepare a fake release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp LICENSE NOTICE build/cli
          tar -czf "$RUNNER_TEMP/release/json-schema-semver-linux-x86_64.tar.gz" \
            -C build/cli json-schema-semver LICENSE NOTICE
          cd "$RUNNER_TEMP/release" && sha256sum -- *.tar.gz > SHA256SUMS
          echo "JSON_SCHEMA_SEMVER_RELEASE_URL=file://$RUNNER_TEMP/release" >> "$GITHUB_ENV"
      - name: Download the tool
        id: download
        uses: ./
        with:
          path: test/cli/schemas/minor.json
          base_path: test/cli/schemas/base.json
          base_version: 1.2.3
      - run: |
          test "${{ steps.download.outputs.version }}" = "1.3.0"
          test "${{ steps.download.outputs.change }}" = "minor"

      - name: Corrupt the fake release
        run: echo "0000  json-schema-semver-linux-x86_64.tar.gz" > "$RUNNER_TEMP/release/SHA256SUMS"
      - name: Download the tool with the wrong checksum
        id: checksum_error
        continue-on-error: true
        uses: ./
        with:
          path: test/cli/schemas/minor.json
          base_path: test/cli/schemas/base.json
          base_version: 1.2.3
      - run: test "${{ steps.checksum_error.outcome }}" = "failure"
